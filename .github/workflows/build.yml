name: Build and Release

on:
  push:
    branches: [ "test-ci", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows App & Plugin
    runs-on: windows-2022
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          python -m pip install uv
          $uvPath = "$((Get-Process -Id $PID).Path | Split-Path)\..\Scripts"
          echo "$uvPath" >> $env:GITHUB_PATH

      - name: Install Python Dependencies
        run: |
          uv venv
          uv pip install pyinstaller -r requirements.txt

      - name: Fetch OBS Dependencies
        run: |
          uv run python obs-plugin/cmake/common/scripts/fetch_deps.py --preset windows-x64

      - name: Build OBS Plugin
        working-directory: obs-plugin
        run: |
          cmake --preset windows-x64 -Dobs-studio_DIR="dependencies/obs-studio/lib/cmake/obs-studio"
          cmake --build --preset windows-x64 --config RelWithDebInfo

      - name: Build EXE with PyInstaller
        run: |
          uv run pyinstaller `
          --noconfirm `
          --name "AutoSplit64plus" `
          --splash "resources/gui/icons/as64plus.png" `
          --icon "resources/gui/icons/as64plus.ico" `
          --noconsole `
          --clean `
          --noupx `
          --contents-directory "libraries" `
          AutoSplit64.py

      - name: Organize Files
        run: |
          xcopy /E /I /Y logic      dist\AutoSplit64plus\logic
          xcopy /E /I /Y resources  dist\AutoSplit64plus\resources
          xcopy /E /I /Y routes     dist\AutoSplit64plus\routes
          xcopy /E /I /Y templates  dist\AutoSplit64plus\templates
          xcopy /Y defaults.ini     dist\AutoSplit64plus\
          
          if (!(Test-Path "dist\AutoSplit64plus\obs-plugin")) { New-Item -ItemType Directory -Path "dist\AutoSplit64plus\obs-plugin" }
          xcopy /Y obs-plugin\build_x64\RelWithDebInfo\autosplit64plus-framegrabber.dll dist\AutoSplit64plus\obs-plugin\

      - name: Create Zip Archive
        run: Compress-Archive -Path dist\AutoSplit64plus\* -DestinationPath AutoSplit64plus-Windows.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoSplit64plus-Windows-Build
          path: AutoSplit64plus-Windows.zip